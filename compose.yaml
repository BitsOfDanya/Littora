name: littora

services:
  backend:
    build:
      context: ./backend
    image: littora-backend:0.1.0
    environment:
      LITTORA_ENVIRONMENT: ${LITTORA_ENVIRONMENT:-production}
      LITTORA_LOG_LEVEL: ${LITTORA_LOG_LEVEL:-INFO}
      LITTORA_CORS_ORIGINS: ${LITTORA_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data/case:/data/case:ro
      - ./data/aoi:/data/aoi:ro
      - ./data/validation:/data/validation:ro
      - ./reports:/reports:ro
      - ./models/detector/service:/models/detector/service:ro
      - ./models/concentration/service:/models/concentration/service:ro
      - analyses:/storage
    ports:
      - "127.0.0.1:${LITTORA_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /
        NEXT_PUBLIC_DEMO_FIXTURES: ${NEXT_PUBLIC_DEMO_FIXTURES:-false}
        LITTORA_API_PROXY_TARGET: http://backend:8000
    image: littora-frontend:0.1.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${LITTORA_FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  analyses:
