name = "raunet_hard"
data = "marida_l2a"
split = "common"
seed = 42

[input]
indices = true

[model]
kind = "raunet"
width = 32
depth = 4
dropout = 0.1

[loss]
kind = "bce_dice"
pos_weight = 4.0
aux_weight = 0.0

[loss.negative_weights]
2 = 2.0
3 = 2.0
4 = 3.0
5 = 3.0
9 = 2.0
14 = 2.0

[train]
epochs = 80
batch = 16
lr = 0.001
weight_decay = 0.0001
positive_oversample = 3.0
hard_negative_oversample = 1.5
hard_negative_classes = [5, 14]
patience = 25
tta = true

[labels]
max_confidence_code = 3
