name = "raunet_aux"
data = "marida_l2a"
split = "common"
seed = 42

[input]
indices = true

[model]
kind = "raunet"
width = 32
depth = 4
dropout = 0.1

[loss]
kind = "bce_dice"
pos_weight = 4.0
aux_weight = 0.3

[train]
epochs = 80
batch = 16
lr = 0.001
weight_decay = 0.0001
positive_oversample = 3.0
patience = 25
tta = true

[labels]
max_confidence_code = 3
