name = "unetpp_resnet34"
data = "marida_l2a"
split = "common"
seed = 42

[input]
indices = true

[model]
kind = "unetplusplus"
encoder = "resnet34"
encoder_weights = "imagenet"

[loss]
kind = "bce_dice"
pos_weight = 4.0
aux_weight = 0.0

[train]
epochs = 80
batch = 16
lr = 0.0005
weight_decay = 0.0001
positive_oversample = 3.0
patience = 25
tta = true

[labels]
max_confidence_code = 3
