[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "littora-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "lightgbm>=4.5",
  "catboost>=1.2",
  "torch>=2.5",
  "segmentation-models-pytorch>=0.4",
  "rasterio>=1.4",
  "shapely>=2.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "matplotlib>=3.9",
  "pyshp>=2.3",
  "h5py>=3.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.hatch.build.targets.wheel]
packages = ["littora_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["littora_ml", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
